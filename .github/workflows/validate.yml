name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
          # brands: only matters for the official HACS index.
          # images: wants a screenshot in the README - again an index
          #   requirement, not something running as a custom repository needs.
          #   Drop both if this card ever goes into the HACS index.
          ignore: brands images

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Test suite
        run: npm test
