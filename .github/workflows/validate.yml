name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
          # brands: nur fuer den offiziellen HACS-Index relevant.
          # images: verlangt einen Screenshot in der README - ebenfalls eine
          #   Anforderung des HACS-Index, nicht des Custom-Repository-Betriebs.
          #   Beide entfernen, falls die Karte je in den HACS-Index soll.
          ignore: brands images

  syntax:
    name: JS syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --check
        run: node --check dist/donetick-chores-card.js
