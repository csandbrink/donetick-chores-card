name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
          # brands: only matters for the official HACS index.
          # images: wants a screenshot in the README - again an index
          #   requirement, not something running as a custom repository needs.
          #   Drop both if this card ever goes into the HACS index.
          ignore: brands images

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Build is up to date
        # dist/ is committed because HACS serves it straight from the
        # repository. A change to src/ without a rebuilt dist/ would ship
        # stale code, so the committed file must match what src/ produces.
        run: git diff --exit-code dist/
      - name: Syntax check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Test suite
        run: npm test
      - name: Audit runtime dependencies
        # The card ships no runtime dependencies, so this only ever flags a
        # package that was added by mistake. Dev tooling is covered by Dependabot.
        run: npm audit --omit=dev --audit-level=high
